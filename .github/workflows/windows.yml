name: Windows

# The Windows release on real Windows machines, one per CPU (natives can't cross-build): the installer (unsigned NSIS),
# the desktop unit tests, the installed app's runtime e2e, then the whole Electron e2e suite. Runs on demand
# (Actions → Windows → Run workflow, or `gh workflow run windows.yml --ref dev`) and on feat/windows-** pushes.

on:
  workflow_dispatch:
  workflow_call: # release.yml
  push:
    branches: [main, 'feat/windows-**']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm } # free on public repos only
    runs-on: ${{ matrix.runner }}
    # shortcut: on windows-11-arm the installed folder loses every .exe/.dll the installer's payload carries (2026-11-19,
    # cause unknown) — arm64 can't block a release until fixed; the x64 installer runs on ARM PCs under emulation.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      # The shipped template/plugin files must stay LF, as on macOS (Windows runners default to CRLF checkouts).
      - run: git config --global core.autocrlf false
      # Long-form temp: the runner's TEMP is an 8.3 name (C:\Users\RUNNER~1), and Vite 8 refuses to serve any 8.3-looking
      # path on Windows (looksLikeWindowsShortNamePath). A user's projects live under their long home path instead.
      - run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            preview-template/package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - name: Install preview template and desktop
        run: |
          npm ci --prefix preview-template
          npm ci --prefix desktop
      - name: Editor build (the desktop app bundles it)
        id: editor
        run: npm run build --workspace=app
      - name: Runtime deps (Windows natives) + relay bundle
        id: deps
        run: |
          npm run deps --prefix desktop
          npm run mcp --prefix desktop
      - name: Desktop unit tests
        run: npm test --prefix desktop
      - name: Instance paths on a Windows disk + relay unit tests
        if: ${{ !cancelled() }}
        run: |
          npx vitest run src/vite-plugin/__tests__/windows-paths.test.ts src/vite-plugin/__tests__/windows-paths.fs.test.ts --root app
          npm run test:run --prefix mcp
      - name: Snapshot is the same on Windows (POSIX keys, OS-independent version)
        if: ${{ !cancelled() }}
        run: node scripts/build-snapshot.js --check
      # Only a complete build is packaged: a skipped editor/deps step must never ship a half-empty installer.
      - name: Installer
        id: installer
        if: ${{ !cancelled() && steps.editor.outcome == 'success' && steps.deps.outcome == 'success' }}
        working-directory: desktop
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
      - name: Install it (silent, per-user — what a double-click does)
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        working-directory: desktop
        run: |
          $setup = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          $run = Start-Process -Wait -PassThru -FilePath $setup.FullName -ArgumentList '/S'
          Write-Output "$($setup.Name) exited $($run.ExitCode)"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Starquix.exe' | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Depth 1 -ErrorAction SilentlyContinue | Out-Host
            Get-MpThreatDetection -ErrorAction SilentlyContinue | Select-Object -First 5 | Format-List | Out-Host
            throw 'Starquix.exe was not installed'
          }
          "SQ_INSTALLED=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Output "installed: $($exe.FullName)"
      - name: E2E — the installed app (runtime)
        id: runtime
        if: ${{ !cancelled() && env.SQ_INSTALLED != '' }}
        working-directory: desktop
        env:
          SQ_E2E_APP: ${{ env.SQ_INSTALLED }}
        run: npx playwright test e2e/runtime.spec.mjs --output test-results/installed
      # Only an installer that installed and ran is shipped (release.yml publishes these artifacts).
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        with:
          name: starquix-windows-${{ matrix.arch }}
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: E2E — every spec (dev editor + unpacked app)
        # shortcut: 5 of 30 specs fail on CI (first run 2026-11-19); advisory until fixed, the installed-app spec above gates.
        continue-on-error: true
        if: ${{ !cancelled() && steps.editor.outcome == 'success' && steps.deps.outcome == 'success' }}
        working-directory: desktop
        run: npx playwright test --output test-results/all
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-results-windows-${{ matrix.arch }}
          path: |
            desktop/test-results
            desktop/playwright-report
          if-no-files-found: ignore
