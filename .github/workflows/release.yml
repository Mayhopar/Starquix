name: Release

# Push a tag vX.Y.Z on a commit in main, equal to desktop/package.json's version → the CI gates, then Windows (x64),
# Linux (AppImage + .deb, x64, arm64) and macOS (arm64 dmg, signed + notarized) installers, each installed or launched and
# e2e-tested on its own runner, published as this repo's GitHub Release. Any failure publishes nothing (desktop/RELEASE.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the main-only check needs main's history
      - name: The tagged commit is on main (a tag on any other branch never publishes)
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main — tag a commit in main"; exit 1; }
      - name: Tag = desktop/package.json version (the app's update notifier compares that version)
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, desktop/package.json says $V"; exit 1; }

  # The same gates as every push (app tests + lint, snapshot freshness, desktop unit tests), on the tagged commit itself.
  gates:
    needs: version
    uses: ./.github/workflows/ci.yml

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml

  linux:
    needs: version
    uses: ./.github/workflows/linux.yml

  mac:
    needs: version
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 150 # a team's first notarization can take ~95 min
    # The signing secrets reach ONLY the steps that sign or notarize — never npm ci, the builds or the tests, whose
    # third-party install scripts and code could otherwise read the Developer ID key. The API key file lives only
    # for the step that writes it.
    steps:
      - name: Signing secrets are set (an unsigned dmg can't be opened on another Mac)
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::$name is empty — set the macOS signing secrets (desktop/RELEASE.md)"; exit 1; }
          done
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            preview-template/package-lock.json
            desktop/package-lock.json
      - name: Install
        run: npm ci && npm ci --prefix preview-template && npm ci --prefix desktop
      - name: Editor build, runtime deps, relay bundle
        run: |
          npm run build --workspace=app
          npm run deps --prefix desktop
          npm run mcp --prefix desktop
      - name: Desktop unit tests
        run: npm test --prefix desktop
      - name: Build, sign + notarize + staple the app, sign the dmg
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"; trap 'rm -f "$APPLE_API_KEY"' EXIT
          (umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY")
          npx electron-builder --mac dmg --arm64 --publish never -c.dmg.sign=true
          APP=dist/mac-arm64/Starquix.app
          [ -z "$(find "$APP/Contents/Resources/editor/fonts" "$APP/Contents/Resources/editor/videos" -type f 2>/dev/null)" ] ||
            { echo "::error::the bundle carries editor/fonts or editor/videos (local-only assets)"; exit 1; }
          spctl -a -vv -t exec "$APP"
      # The same gate as windows.yml / linux.yml: only an app that launched and ran is shipped.
      - name: E2E — the signed app (runtime)
        working-directory: desktop
        env:
          SQ_E2E_APP: ${{ github.workspace }}/desktop/dist/mac-arm64/Starquix.app/Contents/MacOS/Starquix
        run: npx playwright test e2e/runtime.spec.mjs --output test-results/installed
      - name: Notarize + staple the dmg
        working-directory: desktop
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"; trap 'rm -f "$KEY"' EXIT
          (umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$KEY")
          DMG=$(ls dist/*.dmg)
          xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: starquix-mac-arm64
          path: desktop/dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: e2e-results-mac-arm64
          path: |
            desktop/test-results
            desktop/playwright-report
          if-no-files-found: ignore

  release:
    needs: [gates, windows, linux, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: starquix-*
          merge-multiple: true
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF_NAME#v}
          (cd out && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Starquix $V" --generate-notes --notes "**Install**
          - **macOS** (Apple Silicon, 13+): \`Starquix-$V-arm64.dmg\` — open it, drag Starquix to Applications.
          - **Windows** 10/11: \`Starquix-Setup-$V-x64.exe\` (also runs on Windows on ARM). Not code-signed yet: SmartScreen → More info → Run anyway.
          - **Linux**: Ubuntu/Debian \`sudo apt install ./Starquix-$V-amd64.deb\` (ARM: \`-arm64.deb\`); other distros \`Starquix-$V-x86_64.AppImage\` (needs libfuse2).

          Checksums: \`SHA256SUMS\`." out/*
