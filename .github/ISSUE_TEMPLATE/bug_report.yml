name: Bug report
description: Something in Starquix is broken or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead. A screenshot or a screen recording helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Starquix version
      description: Shown at the bottom of the Projects page
      placeholder: 0.0.2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: macOS 15.1, Windows 11 24H2, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - New project made in Starquix
        - Imported Astro site
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Anything shown in an error dialog or the terminal. Remove anything private first.
      render: text
